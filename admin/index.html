<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login | Chlyn’s Fragrance</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <link rel="stylesheet" href="css/admin.css" />
</head>
<body data-admin-page="login">
  <div class="admin-login">
    <div class="admin-login-box">
      <div class="admin-card">
        <div class="admin-card-body" style="padding:22px;">
          <div class="admin-login-brand">Admin Login</div>
          <div class="admin-login-hint">Default password is <span style="color:rgba(212,175,55,.95); font-weight:700">admin</span>. You can change it later in Settings.</div>

          <form id="adminLoginForm">
            <label class="form-label admin-muted">Password</label>
            <div class="input-group">
              <span class="input-group-text" style="border-radius:14px 0 0 14px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);color:rgba(255,255,255,.8)"><i class="bi bi-lock"></i></span>
              <input id="adminPassword" class="form-control" type="password" placeholder="Enter password" style="border-left:0;border-radius:0 14px 14px 0;" />
            </div>
            <div id="adminLoginError" class="admin-danger" style="min-height:22px; margin-top:10px;"></div>

            <button class="btn btn-gold w-100 py-2 mt-2" type="submit">Login</button>

            <div class="admin-muted" style="margin-top:14px; font-size:.92rem;">This is a static admin UI (no backend). Data is saved in your browser.</div>
          </form>
        </div>
      </div>

      <div class="text-center admin-muted" style="margin-top:14px; font-size:.92rem;">© <span id="adminYear"></span> Chlyn’s Fragrance</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('adminYear').textContent = String(new Date().getFullYear());
  </script>
  <script src="js/admin.js"></script>
</body>
</html>
