<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reviews | Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body data-admin-page="reviews">
  <div class="admin-shell">
    <aside class="admin-sidebar">
      <div class="admin-brand">Chlyn’s Admin</div>
      <div class="admin-subbrand">Manage products, reviews, testimonials, and settings.</div>
      <nav class="admin-nav">
        <a href="dashboard.html" data-admin-nav="dashboard"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a href="products.html" data-admin-nav="products"><i class="bi bi-box-seam"></i> Products</a>
        <a href="homepage.html" data-admin-nav="homepage"><i class="bi bi-layout-text-window"></i> Homepage</a>
        <a href="categories.html" data-admin-nav="categories"><i class="bi bi-grid-3x3-gap"></i> Categories</a>
        <a href="gallery.html" data-admin-nav="gallery"><i class="bi bi-images"></i> Gallery</a>
        <a href="testimonials.html" data-admin-nav="testimonials"><i class="bi bi-chat-quote"></i> Testimonials</a>
        <a href="reviews.html" data-admin-nav="reviews"><i class="bi bi-star"></i> Reviews</a>
        <a href="settings.html" data-admin-nav="settings"><i class="bi bi-gear"></i> Settings</a>
      </nav>
    </aside>

    <main class="admin-main">
      <div class="admin-topbar">
        <div class="admin-topbar-inner">
          <div class="d-flex align-items-center gap-2">
            <button id="adminMobileToggle" class="admin-mobile-toggle" type="button" aria-label="Open menu"><i class="bi bi-list"></i></button>
            <h1 class="admin-title">Reviews</h1>
          </div>
          <div class="d-flex align-items-center gap-2 admin-top-actions">
            <button id="importReviews" class="btn btn-sm btn-outline-gold" type="button"><i class="bi bi-upload"></i> Import</button>
            <button id="exportReviews" class="btn btn-sm btn-outline-gold" type="button"><i class="bi bi-download"></i> Export</button>
            <button id="adminLogout" class="btn btn-sm btn-outline-danger" type="button"><i class="bi bi-box-arrow-right"></i> Logout</button>
          </div>
        </div>
      </div>

      <div class="container py-4" style="max-width:1100px;">
        <div class="admin-card">
          <div class="admin-card-body">
            <label class="form-label admin-muted">Select product</label>
            <select id="reviewProduct" class="form-select"></select>
          </div>
        </div>

        <div class="row g-3" style="margin-top:2px;">
          <div class="col-lg-5">
            <div class="admin-card">
              <div class="admin-card-head">
                <div id="reviewFormTitle" style="font-weight:800">Add Review</div>
              </div>
              <div class="admin-card-body">
                <form id="reviewForm" class="vstack gap-3">
                  <div>
                    <label class="form-label admin-muted">Stars</label>
                    <select id="rStars" class="form-select">
                      <option value="5">5</option>
                      <option value="4">4</option>
                      <option value="3">3</option>
                      <option value="2">2</option>
                      <option value="1">1</option>
                    </select>
                  </div>
                  <div>
                    <label class="form-label admin-muted">Reviewer label</label>
                    <input id="rWho" class="form-control" placeholder="Verified Customer" />
                  </div>
                  <div>
                    <label class="form-label admin-muted">Review text</label>
                    <textarea id="rText" class="form-control" rows="4" placeholder="Write the review..."></textarea>
                  </div>
                  <div class="d-flex gap-2 flex-wrap">
                    <button id="reviewSaveBtn" class="btn btn-gold" type="submit">Save</button>
                    <button id="reviewResetBtn" class="btn btn-outline-gold" type="button">Reset</button>
                  </div>
                </form>
              </div>
            </div>
          </div>

          <div class="col-lg-7">
            <div class="admin-card">
              <div class="admin-card-head">
                <div style="font-weight:800">Reviews for selected product</div>
              </div>
              <div class="admin-card-body">
                <div id="reviewsList"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
